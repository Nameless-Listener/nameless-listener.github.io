<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link
      href="https://fonts.googleapis.com/css?family=Bitter:400,700&display=swap&subset=latin-ext"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://meyerweb.com/eric/tools/css/reset/reset.css"
    />
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="icon" type="img/jpg" href="img/artist.jpeg">
    <title>Nameless Listener - Now Playing</title>
  </head>
  <body>
    <nav class="nav">
      <a href="index.html" class="nav__link -active">♫ Player</a>
      <a href="artist.html" class="nav__link">
        Artist &nbsp;
        <img src="img/bio.svg" alt="Bio" />
      </a>
    </nav>
    <div class="wrapper" id="app">
      <div class="spotify-player">
        <div class="spotify-player__tracks">
          <iframe
            src="https://open.spotify.com/embed/album/1GYXLPBPYrD3wkankb4qeb?utm_source=generator"
            height="152"
            allow="autoplay;
            encrypted-media;
            picture-in-picture"

          </iframe>
          <iframe
            src="https://open.spotify.com/embed/album/7y9RCC2zTk40Fv3JDnGpmU?utm_source=generator&theme=0"
            height="152"
            allow="autoplay;
            encrypted-media;
            picture-in-picture"
            >
          </iframe>
          <iframe
            src="https://open.spotify.com/embed/album/5BGb4j7dGS2uPCfcvXb8kC?utm_source=generator"
            height="152"
            allow="autoplay;
            encrypted-media;
            picture-in-picture"
            >

        <div class="spotify-player__main">
          <iframe 
            src="https://open.spotify.com/embed/album/0B26AV9ck1Dzg82ofzhRqA" 
            height="500px" 
            allow="autoplay;
            encrypted-media;
            picture-in-picture"
            >
          </iframe>
        </div>
      </div>
      <div class="icon-btn">
        <a href="https://github.com/Nameless-Listener/nameless-listener.github.io" target="_blank" class="icon-link">
          <img src="img/github.svg" alt="GitHub" />
        </a>
        <a href="https://open.spotify.com/artist/2kLN8zqbgDTZdkQPZEumI3" target="_blank" class="icon-link">
          <img src="img/spotify.svg" alt="Spotify" />

      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.10/dist/vue.js"></script>
    <script src="./scripts/script.js"></script>

</html>
